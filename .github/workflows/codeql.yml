name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-site:
    name: Analyze website worker and release tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          # worker.mjs serves pingwarden.app in production and build.mjs
          # writes its CSP; the Python files are the release tooling.
          languages: javascript-typescript,python
          queries: security-extended
          build-mode: none
          config: |
            paths:
              - Site
              - scripts
            paths-ignore:
              - Site/node_modules
              - Site/public

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

  analyze:
    name: Analyze Swift and Objective-C
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyze Objective-C helper with Xcode
        env:
          PW_HELPER_ANALYSIS_ROOT: ${{ runner.temp }}/PingWardenHelperAnalysis
        run: |
          xcodebuild analyze \
            -project PingWarden/PingWarden.xcodeproj \
            -target PingWardenHelper \
            -configuration Release \
            -sdk macosx \
            SYMROOT="$PW_HELPER_ANALYSIS_ROOT/products" \
            OBJROOT="$PW_HELPER_ANALYSIS_ROOT/intermediates" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import plistlib

          root = Path(os.environ["PW_HELPER_ANALYSIS_ROOT"])
          sources = {p.stem for p in Path("PingWarden/PingWardenHelper").glob("*.m")}
          if not sources:
              raise SystemExit("No helper sources found for analysis verification")
          expected = {(arch, name) for arch in ("arm64", "x86_64") for name in sources}
          found = set()
          for report in root.glob("intermediates/**/StaticAnalyzer/**/*.plist"):
              key = (report.parent.name, report.stem)
              if key not in expected:
                  continue
              if key in found:
                  raise SystemExit(f"Duplicate helper analysis result: {key}")
              with report.open("rb") as stream:
                  result = plistlib.load(stream)
              diagnostics = result.get("diagnostics") if isinstance(result, dict) else None
              if not isinstance(diagnostics, list) or diagnostics:
                  raise SystemExit(f"Helper analysis has findings or invalid results: {report}")
              found.add(key)
          if found != expected:
              raise SystemExit(f"Missing helper analysis results: {sorted(expected - found)}")
          print(f"Native helper analysis verified {len(found)} source/architecture results with no findings.")
          PYTHON

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: swift
          queries: security-extended
          build-mode: manual

      - name: Build complete app for analysis
        run: |
          xcodebuild build \
            -project PingWarden/PingWarden.xcodeproj \
            -scheme PingWarden \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PingWardenCodeQL" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO

      - name: Perform CodeQL analysis
        id: native-analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

      - name: Verify successful application and widget Swift extraction
        env:
          CODEQL_SWIFT_DATABASE: ${{ fromJSON(steps.native-analysis.outputs.db-locations).swift }}
        run: python3 scripts/verify_codeql_swift_extraction.py "$CODEQL_SWIFT_DATABASE" .
