name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-site:
    name: Analyze website worker and release tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          # worker.mjs serves pingwarden.app in production and build.mjs
          # writes its CSP; the Python files are the release tooling.
          languages: javascript-typescript,python
          queries: security-extended
          build-mode: none
          config: |
            paths:
              - Site
              - scripts
            paths-ignore:
              - Site/node_modules
              - Site/public

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

  analyze:
    name: Analyze Swift and Objective-C
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: swift,c-cpp
          queries: security-extended
          build-mode: manual

      - name: Build complete app for analysis
        run: |
          xcodebuild build \
            -project PingWarden/PingWarden.xcodeproj \
            -scheme PingWarden \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PingWardenCodeQL" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
